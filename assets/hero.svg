<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Global soil fungi</title>
  <desc id="desc">Six stacked map layers over an Equal Earth globe: soil fungal diversity, ectomycorrhizal structure and taxonomic resolution mapped at 250 m with prediction uncertainty.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14100c"/><stop offset=".55" stop-color="#2a1f16"/><stop offset="1" stop-color="#3b2d1f"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6a45"/><stop offset="1" stop-color="#4a3522"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#f3dfc1" stroke-opacity=".05"/></pattern>
    <clipPath id="globe"><ellipse cx="0" cy="0" rx="230" ry="118"/></clipPath>
  </defs>
  <rect width="1440" height="520" rx="24" fill="url(#bg)"/><rect width="1440" height="520" rx="24" fill="url(#grid)"/>
  <g opacity=".22" fill="none" stroke="#d9b66f" stroke-width="1.5">
    <path d="M0 430c160-40 290 30 450-6s310-50 480 4 340 60 510 6"/>
    <path d="M0 462c150-38 300 28 455-10s300-40 470 10 345 52 515 4"/>
  </g>
  <g transform="translate(70 70)">
    <rect width="760" height="380" rx="26" fill="#1c140d" fill-opacity=".78" stroke="#d9b66f" stroke-opacity=".25"/>
    <text x="52" y="72" fill="#d9b66f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">OPEN RESEARCH &#183; SOIL BIODIVERSITY</text>
    <text x="52" y="140" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="750">Global soil fungi</text>
    <text x="52" y="198" fill="#ead9bf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23"><tspan x="52">Diversity, ectomycorrhizal structure and</tspan><tspan x="52" dy="34">taxonomic resolution mapped at 250 m,</tspan><tspan x="52" dy="34">with the uncertainty of every prediction.</tspan></text>
    <g transform="translate(52 318)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650" text-anchor="middle" fill="#fbefdc">
      <rect width="176" height="38" rx="19" fill="#d9b66f" fill-opacity=".14" stroke="#d9b66f" stroke-opacity=".5"/><text x="88" y="25">4,130 GloSED samples</text>
      <rect x="190" width="150" height="38" rx="19" fill="#d9b66f" fill-opacity=".14" stroke="#d9b66f" stroke-opacity=".5"/><text x="265" y="25">146 covariates</text>
      <rect x="354" width="182" height="38" rx="19" fill="#d9b66f" fill-opacity=".14" stroke="#d9b66f" stroke-opacity=".5"/><text x="445" y="25">6 maps &#215; 6 bands</text>
    </g>
  </g>
  <g transform="translate(1130 250)" filter="url(#shadow)">
    <g transform="translate(0 92)" opacity=".95"><ellipse rx="230" ry="118" fill="#1f4e8c"/></g>
    <g transform="translate(0 70)" opacity=".95"><ellipse rx="230" ry="118" fill="#6b2a4f"/></g>
    <g transform="translate(0 48)" opacity=".95"><ellipse rx="230" ry="118" fill="#9c3d6b"/></g>
    <g transform="translate(0 26)" opacity=".95"><ellipse rx="230" ry="118" fill="#7b5ea7"/></g>
    <g transform="translate(0 4)" opacity=".95"><ellipse rx="230" ry="118" fill="#2f6d9a"/></g>
    <g transform="translate(0 -18)">
      <ellipse rx="230" ry="118" fill="#4e7d2f" stroke="#f3e6c8" stroke-width="3"/>
      <g clip-path="url(#globe)" fill="#cfe0a8" fill-opacity=".85">
        <path d="M-170 -70c30-20 70-14 92 4 18 15 10 40-8 52-20 13-24 40-46 50-20 9-38-8-44-28-6-22-14-58 6-78z"/>
        <path d="M-40 -60c26-14 60-10 78 8 14 14 6 34-10 44-14 9-12 30-28 44-18 15-42 6-48-14-8-26-14-66 8-82z"/>
        <path d="M50 -78c40-16 96-8 126 16 22 18 14 48-10 58-26 11-44 30-72 26-30-4-58-26-60-52-2-20 0-38 16-48z"/>
        <path d="M120 30c22-8 48 0 56 18 8 18-4 36-24 40-22 4-44-6-46-26-2-14 2-26 14-32z"/>
      </g>
      <ellipse rx="230" ry="118" fill="none" stroke="#f3e6c8" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 6"/>
    </g>
  </g>
  <text x="1370" y="486" text-anchor="end" fill="#e9d3ad" fill-opacity=".8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">GLOSED &#183; QUANTILE RANDOM FOREST &#183; SPATIAL HOLD-OUT</text>
</svg>

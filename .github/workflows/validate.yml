name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    name: Syntax, links and citation metadata
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Parse every R script
        shell: Rscript {0}
        run: |
          files <- sort(list.files("scripts", pattern = "[.]R$", full.names = TRUE, recursive = TRUE))
          invisible(lapply(files, parse))
          message("Parsed ", length(files), " R scripts.")

      - name: Check Earth Engine scripts syntax
        run: |
          find scripts -name "*.js" -print0 | xargs -0 -n1 node --check
          echo "Earth Engine scripts parsed."

      - name: Check ASCII-only text files
        run: |
          if grep -rIlP '[^\x00-\x7F]' --include='*.R' --include='*.js' --include='*.md' --include='*.sh' --include='*.cff' --include='*.json' .; then
            echo "Non-ASCII characters found in the files above."; exit 1
          fi

      - name: Validate .zenodo.json
        run: python -m json.tool .zenodo.json > /dev/null

      - name: Validate local documentation links
        run: python tools/check_local_links.py

      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"
